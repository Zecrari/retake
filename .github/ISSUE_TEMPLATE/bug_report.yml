name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste API keys or unredacted cassettes.** Run `retake check` on anything you share."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include the `retake` output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. retake record -- ...
        2. retake replay -- ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: retake version
      placeholder: output of `retake --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, language and SDK
      placeholder: e.g. macOS 15, Python 3.13, openai 2.x
    validations:
      required: true
