name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "install.sh", "install.ps1", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp install.sh install.ps1 _site/
          # Stamp the sitemap with the date of the last change to the site.
          lastmod=$(git log -1 --format=%cs -- site)
          sed -i "s/__LASTMOD__/${lastmod}/g" _site/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
