<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — retake</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/retake/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/retake/assets/site.css">
  <script>
    try {
      var t = localStorage.getItem("retake-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <main class="wrap not-found">
    <div>
      <p class="kicker">404</p>
      <h1>No recording for this page.</h1>
      <p class="lede" style="margin-inline:auto">The page you asked for doesn't exist — maybe the link moved.</p>
      <div class="cta-row" style="justify-content:center">
        <a class="btn btn-primary" href="/retake/">Home</a>
        <a class="btn" href="/retake/docs/">Documentation</a>
      </div>
    </div>
  </main>
</body>
</html>
