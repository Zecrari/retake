<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>retake dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body data-view="list">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="retake dashboard home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" class="mark-bg"/><path d="M48.74 34.95A17 17 0 1 1 40.5 17.28" fill="none" class="mark-fg-stroke" stroke-width="5" stroke-linecap="round"/><path d="M47.6 21.4 42.3 10.1 34.3 24Z" class="mark-fg"/><circle cx="32" cy="32" r="7.5" fill="#ff5a4b"/></svg>
      <span>retake</span>
    </a>
    <span class="mode" id="mode" hidden></span>
    <code class="dir" id="dir" title="Cassette directory"></code>
    <div class="topbar-actions">
      <a class="icon-btn" href="https://zecrari.github.io/retake/docs/" target="_blank" rel="noopener" title="Documentation" aria-label="Documentation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>
      </a>
      <button class="icon-btn" id="theme" type="button" title="Toggle theme" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="pane sidebar" aria-label="Cassettes">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Filter cassettes" aria-label="Filter cassettes" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <a class="nav-live" id="nav-live" href="#/live" hidden>
        <span class="pulse" aria-hidden="true"></span>
        <span>Live activity</span>
        <span class="counts" id="live-counts"></span>
      </a>
      <div class="side-head">
        <span>Cassettes</span>
        <span class="muted" id="session-count"></span>
      </div>
      <div class="sessions" id="sessions" role="list"></div>
    </nav>

    <section class="pane list" id="list" aria-label="Interactions"></section>
    <section class="pane detail" id="detail" aria-label="Details"></section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog class="modal" id="confirm">
    <div class="modal-body">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button class="btn" type="button" id="confirm-cancel">Cancel</button>
        <button class="btn danger" type="button" id="confirm-ok">Delete</button>
      </div>
    </div>
  </dialog>
</body>
</html>
